<title>Season Map</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--fg:#1b2230;--muted:#5f6b7d;--line:#dfe3ea;--accent:#1c8a6c;--err:#d1432f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--surface:#1a2029;--fg:#e8ecf2;--muted:#9aa6b8;--line:#2c3441;--accent:#45c49e;--err:#ff6a55;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%;max-width:360px;display:grid;gap:12px;box-sizing:border-box}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);font-size:13px}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#err{color:var(--err);font-size:13px;min-height:1em}
[hidden]{display:none!important}
</style>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(tok){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(tok),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.iv)},key,d(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function tryTok(tok,remember){
  try{const html=await open_(tok.trim());if(remember){try{localStorage.setItem('smTok',tok.trim())}catch(e){}}show(html);return true}
  catch(e){return false}
}
(async()=>{
  let tok=null;
  const m=location.hash.match(/^#t=([A-Za-z0-9_-]+)/);
  if(m){tok=m[1];history.replaceState(null,'',location.pathname);}
  if(!tok){try{tok=localStorage.getItem('smTok')}catch(e){}}
  if(tok&&await tryTok(tok,true))return;
  try{localStorage.removeItem('smTok')}catch(e){}
  const f=document.getElementById('f');f.hidden=false;
  if(tok)document.getElementById('err').textContent='That token did not work. It may have been changed.';
  f.addEventListener('submit',async ev=>{ev.preventDefault();
    document.getElementById('err').textContent='Unlocking…';
    if(!await tryTok(document.getElementById('t').value,document.getElementById('r').checked))
      document.getElementById('err').textContent='Wrong token. Check it and try again.';
  });
  document.getElementById('t').focus();
})();
</script>
